<svg viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shubham Chaudhary, developer in progress from Mumbai, India">
  <style>
    :root { --ink: #202020; --muted: #777777; --dim: #999999; --rule: #D0D0D0; --accent: #454545; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .name-color { animation: name-color .8s cubic-bezier(.2,.7,.2,1) .4s forwards; }
    @keyframes name-color { from { fill: var(--accent); } to { fill: var(--ink); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1 { animation-delay: .15s; } .a2 { animation-delay: .4s; } .a3 { animation-delay: .8s; }
    .a4 { animation-delay: 1.1s; } .a5 { animation-delay: 1.4s; } .a6 { animation-delay: 1.7s; }
    .focus { opacity: 0; animation: cycle 12s linear infinite; }
    .f1 { animation-delay: 1.8s; } .f2 { animation-delay: 4.8s; } .f3 { animation-delay: 7.8s; } .f4 { animation-delay: 10.8s; }
    @keyframes cycle { 0% { opacity: 0; } 4% { opacity: 1; } 21% { opacity: 1; } 25%,100% { opacity: 0; } }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #F0F0F0; --muted: #A0A0A0; --dim: #777777; --rule: #3A3A3A; --accent: #D0D0D0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .focus, .cursor, .name-color { animation: none; }
      .draw { stroke-dashoffset: 0; } .rise, .fade { opacity: 1; } .focus { opacity: 0; }
      .name-color { fill: var(--ink); }
      .focus.f1 { opacity: 1; } .cursor { visibility: visible; }
    }
  </style>
  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)"/>
  <g class="fade a1 mono" fill="var(--muted)" font-size="11" letter-spacing="3">
    <text x="48" y="42">PERSONAL PROFILE / 001</text>
    <text x="952" y="42" text-anchor="end">MUMBAI, INDIA</text>
  </g>
  <g class="rise a2" fill="var(--ink)">
    <text class="name-color" x="46" y="153" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" font-weight="400"><tspan font-size="70">S</tspan><tspan>hubham Chaudhary</tspan></text>
  </g>
  <g class="fade a3 mono" fill="var(--muted)" font-size="18">
    <text x="49" y="190">Learning, building, and getting better one project at a time.</text>
  </g>
  <g class="fade a4 mono" font-size="12" letter-spacing="1.5">
    <text x="49" y="246" fill="var(--dim)">CURRENTLY LEARNING</text>
    <text x="221" y="246" fill="var(--accent)">WEB DEV</text>
    <circle cx="294" cy="242" r="2" fill="var(--dim)"/>
    <text x="307" y="246" fill="var(--accent)">AI/ML</text>
    <circle cx="365" cy="242" r="2" fill="var(--dim)"/>
    <text x="378" y="246" fill="var(--accent)">DSA</text>
  </g>
  <g class="fade a5 mono" font-size="12" letter-spacing="1.5">
    <text x="49" y="278" fill="var(--dim)">EXPLORING</text>
    <g class="focus f1" fill="var(--accent)"><text x="158" y="278">FRONTEND DEVELOPMENT</text></g>
    <g class="focus f2" fill="var(--accent)"><text x="158" y="278">ARTIFICIAL INTELLIGENCE / ML</text></g>
    <g class="focus f3" fill="var(--accent)"><text x="158" y="278">DATA STRUCTURES &amp; ALGORITHMS</text></g>
    <g class="focus f4" fill="var(--accent)"><text x="158" y="278">PYTHON PROJECTS</text></g>
    <rect class="cursor" x="402" y="266" width="7" height="15" fill="var(--accent)"/>
  </g>
  <line class="draw a6" x1="48" y1="316" x2="952" y2="316" stroke="var(--rule)"/>
  <g class="fade a6 mono" fill="var(--muted)" font-size="10" letter-spacing="2.5">
    <text x="48" y="342">LEARN</text><circle cx="116" cy="338" r="2" fill="var(--dim)"/>
    <text x="132" y="342">BUILD</text><circle cx="201" cy="338" r="2" fill="var(--dim)"/>
    <text x="217" y="342">PRACTICE</text>
  </g>
</svg>
